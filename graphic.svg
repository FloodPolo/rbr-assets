<svg fill="none" viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%;">
      <style>
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #ff6600;
        }
        .main-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            border: 3px solid #ff6600;
            padding: 40px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 25px #ff6600;
        }
        .launch-btn {
            padding: 15px 40px;
            font-size: 20px;
            color: #0d0d0d;
            background-color: #ff6600;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 15px #ff6600;
        }
        #fullscreen-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        iframe { width: 100%; height: 100%; border: none; }
      </style>

      <div class="main-panel" id="panel">
        <h1 style="letter-spacing: 8px;">ROBOREALM V2.0</h1>
        <p style="color: #ffaa00; margin-bottom: 30px;">Access via CDN Image</p>
        <button class="launch-btn" onclick="launchSystem()">LAUNCH SYSTEM</button>
      </div>

      <div id="fullscreen-container">
        <iframe id="frame" src=""></iframe>
      </div>

      <script>
        function launchSystem() {
          const pass = prompt(">>> SYSTEM ACCESS REQUIRED <<<\nEnter Authorization Code:");
          if (pass === "GLASSPAIN") {
            document.getElementById('panel').style.display = 'none';
            document.getElementById('fullscreen-container').style.display = 'block';
            // Loading the main site directly from CDN
            document.getElementById('frame').src = "https://cdn.jsdelivr.net/gh/FloodPolo/rbr-assets/math.html";
          } else {
            alert("ACCESS DENIED");
          }
        }
      </script>
    </div>
  </foreignObject>
</svg>