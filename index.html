<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboRealm V2.0</title>
<link rel="icon" type="image/png" href="https://codehs.com/uploads/58e51039d5a71b40789167905131dab7">
<style>
body {
    background-color: #0d0d0d; /* Dark tech background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    color: #ff6600;
}
/* Binary Background Container */
.binary-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 200%;
    color: rgba(255, 120, 0, 0.15); /* Faint orange binary */
    font-size: 14px;
    line-height: 1.2;
    z-index: 1;
    pointer-events: none;
    animation: circulate 20s linear infinite;
    white-space: pre;
    word-wrap: break-word;
}
@keyframes circulate {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
}
/* Logo/Main Panel Container */
.main-panel {
    position: relative;
    z-index: 2;
    text-align: center;
    border: 3px solid #ff6600;
    padding: 40px;
    background: rgba(0, 0, 0, 0.9);
    box-shadow: 0 0 25px #ff6600;
    transition: all 0.5s ease;
}
.title {
    color: #ff6600;
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 8px;
    margin: 0;
    text-transform: uppercase;
    text-shadow: 0 0 10px #ff6600;
}
.version {
    color: #ffaa00;
    font-size: 22px;
    margin-top: 10px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}
/* Launch Button Style */
.launch-btn {
    padding: 15px 40px;
    font-size: 20px;
    color: #0d0d0d;
    background-color: #ff6600;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px #ff6600;
    font-family: 'Courier New', Courier, monospace;
}
.launch-btn:hover {
    background-color: #fff;
    box-shadow: 0 0 30px #fff;
}
/* Hidden Loading Text - Shows on launch */
#loading {
    display: none;
    margin-top: 20px;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
}
.dot {
    animation: flash 1.5s infinite;
}
@keyframes flash {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
}
/* Intro Animation Class */
.fade-out {
    animation: fadeOutPanel 1s forwards;
}
@keyframes fadeOutPanel {
    to { opacity: 0; transform: scale(0.9); }
}
/* Fullscreen container for the loaded page */
#fullscreen-container {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10; /* Make sure it covers everything */
    background-color: #0d0d0d; /* Background while loading iframe */
}
/* Iframe to load math.html */
#loaded-page-iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>
<body>
<!-- Animated Binary Background -->
<div class="binary-bg" id="binary"></div>
<!-- Main Content -->
<div class="main-panel" id="panel">
    <h1 class="title">ROBOREALM V2.0</h1>
    <p class="version">Ready to Launch</p>
    <!-- Updated the onclick to the new function -->
    <button class="launch-btn" onclick="promptForPassword()">LAUNCH</button>
    <button class="launch-btn" onclick="launchCodeHS()">Launch A:B</button>

<script>
function launchCodeHS() {
  var win = window.open('', '_blank', 'width=1000,height=1000,resizable=yes,scrollbars=yes');
  if (win) {
    win.document.write(`
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <style>
          html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
          iframe { border: none; width: 100%; height: 100%; }
        </style>
      </head>
      <body>
        <iframe src="https://codehs.com/sandbox/a%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4/old-sandbox-program/embed/?display_mode=default&show_file_tree=False" allowfullscreen></iframe>
      </body>
      </html>
    `);
    win.document.close();
    win.focus();
  }
}
</script>



<script>
function launchBlob() {
    // 1. Define your HTML content
    const htmlContent = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <style>
                html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
                iframe { border: none; width: 100%; height: 100%; }
            </style>
        </head>
        <body>
            <iframe src="https://codehs.com/sandbox/a%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4/old-sandbox-program/embed/?display_mode=default&show_file_tree=False" allowfullscreen></iframe>
        </body>
        </html>
    `;

    // 2. Create a Blob from the HTML string
    const blob = new Blob([htmlContent], { type: 'text/html' });
    
    // 3. Create a unique blob URL
    const blobURL = URL.createObjectURL(blob);

    // 4. Open that URL in a new window
    var win = window.open(blobURL, '_blank', 'width=1000,height=1000,resizable=yes,scrollbars=yes');
    
    if (win) {
        win.focus();
    }
}
</script>


<!-- Added class="launch-btn" to the button below -->
<button class="launch-btn" onclick="launchBlob()">Launch Blob</button>


    <div id="loading">Authorizing<span class="dot">...</span></div>
</div>
<!-- Fullscreen container where math.html will be loaded -->
<div id="fullscreen-container">
    <iframe id="loaded-page-iframe" src="" frameborder="0"></iframe>
</div>

<script>
// Generate random binary background
const binDiv = document.getElementById('binary');
let binText = "";
for(let i=0; i<1000; i++) {
    binText += Math.round(Math.random()) + " ";
}
binDiv.innerText = binText;

// Function to handle the actual loading sequence
function launchSystem() {
    const btn = document.querySelector('.launch-btn');
    const load = document.getElementById('loading');
    const panel = document.getElementById('panel');
    const fullscreenContainer = document.getElementById('fullscreen-container');
    const iframe = document.getElementById('loaded-page-iframe');

    // 1. Hide Button, Show Loading
    btn.style.display = 'none';
    load.style.display = 'block';

    // 2. Add cool animation (fade out after 2.5s)
    setTimeout(() => {
        panel.classList.add('fade-out');
    }, 2500);

    // 3. Load page using iframe after animation duration
    setTimeout(() => {
        // Hide the original panel permanently
        panel.style.display = 'none';
        // Show the fullscreen container and load the page in the iframe
        fullscreenContainer.style.display = 'block';
        iframe.src = 'math.html';
    }, 3500);
}

// New function to prompt for password before launching
function promptForPassword() {
    // Note: For a true, secure login system, you would need server-side authentication.
    // This is a simple client-side check that matches the "tech theme".
    const correctPassword = "GLASSPAIN";
    let enteredPassword = prompt(">>> SYSTEM ACCESS REQUIRED <<<\nEnter Authorization Code:");

    // Check if the password is correct
    if (enteredPassword === correctPassword) {
        // Change loading text to indicate authorization is successful
        document.getElementById('loading').innerHTML = 'Authorization Granted<span class="dot">...</span>';
        // Proceed with the launch sequence
        launchSystem();
    } else {
        alert(">>> ACCESS DENIED <<<\nInvalid authorization code.");
    }
}
</script>


</body>
</html>


<!DOCTYPE html>
<html>
<head>
    <title>User Page</title>
</head>
<body style= font-family: sans-serif;">


    <!-- Notification Toast Element -->
    <div id="techNotify" style="position:fixed;top:20px;right:-350px;width:300px;background:#1a1a1a;color:#fff;padding:15px;border-left:4px solid #ff7f00;box-shadow:0 4px 15px rgba(0,0,0,0.5);font-family:sans-serif;transition:right 0.5s ease-in-out;z-index:9999;border-radius:4px;box-sizing:border-box;">                
        <div style="font-weight:bold;color:#ff7f00;margin-bottom:5px;">Message from Admin</div>
        <div id="notifyMessage" style="font-size:14px;">Process completed successfully.</div>                
        <div id="notifyBar" style="position:absolute;bottom:0;left:0;height:4px;background:#ff7f00;width:100%;"></div>                
    </div>

    <script>
        function showNotification(message) {
            const toast = document.getElementById('techNotify');
            const bar = document.getElementById('notifyBar');
            const messageBody = document.getElementById('notifyMessage');

            if (message) messageBody.innerText = message;

            // Slide in
            toast.style.right = '20px';
            
            // Reset and Animate Bar
            bar.style.transition = 'none';
            bar.style.width = '100%';
            setTimeout(() => {
                bar.style.transition = 'width 3s linear';
                bar.style.width = '0%';
            }, 100);

            // Slide out
            setTimeout(() => {
                toast.style.right = '-350px';
            }, 3000);
        }

        // Listen for storage changes from admin.html
        window.addEventListener('storage', (event) => {
            if (event.key === 'adminBroadcast') {
                showNotification(event.newValue);
            }
        });
    </script>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link id="dynamic-favicon" rel="icon" href="default-favicon.png">
    <title>Home | OrangeTech</title>
</head>
<body style="background: #121212; color: #ff8c00;">
    <h1></h1>
    <p></p>
    <a href="settings.html" style="color: #ffa534;"></a>

    <script>
        function applySettings() {
            const savedName = localStorage.getItem('tabName');
            const savedFav = localStorage.getItem('favIcon');

            if (savedName) document.title = savedName;
            
            if (savedFav) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = savedFav;
            }
        }
        // Run on load
        applySettings();
    </script>
</body>
</html>
