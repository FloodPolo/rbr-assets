<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboRealm Credits</title>
<style>
    /* Orange Tech Theme */
    body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        color: #ff6600;
        font-family: 'Courier New', Courier, monospace;
        overflow-x: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    /* Back to Home Button - Top Left */
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: transparent;
        border: 2px solid #ff6600;
        color: #ff6600;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        z-index: 1000;
        transition: all 0.3s ease;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
    }

    .back-btn:hover {
        background-color: #ff6600;
        color: #0a0a0a;
        box-shadow: 0 0 15px #ff6600;
    }

    .credits-container {
        text-align: center;
        width: 80%;
        max-width: 800px;
    }

    /* Big Animated Text - RoboRealm */
    .title {
        font-size: 4em;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 50px;
        letter-spacing: 5px;
        opacity: 0;
        animation: fadeInDown 2s forwards, glow 2s infinite alternate;
        color: #ff8533;
    }

    /* Medium Text - Topics */
    .topic {
        font-size: 2em;
        margin-top: 30px;
        margin-bottom: 10px;
        opacity: 0;
        animation: fadeIn 1s forwards;
        animation-delay: 2s;
        text-shadow: 0 0 5px #ff6600;
    }

    /* Small Text - Names */
    .names {
        font-size: 1.2em;
        color: #ffb380;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeIn 1s forwards;
        animation-delay: 2.5s;
    }

    /* Animations */
    @keyframes fadeInDown {
        0% { opacity: 0; transform: translateY(-30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes glow {
        from { text-shadow: 0 0 5px #ff6600, 0 0 10px #ff6600; }
        to { text-shadow: 0 0 10px #ff6600, 0 0 20px #ff8533; }
    }

    /* Staggered animation delays for multiple topics */
    .item-1 { animation-delay: 2s; }
    .item-2 { animation-delay: 3s; }
    .item-3 { animation-delay: 4s; }

</style>
</head>
<body>

    <!-- Back to Home Button -->
    <a href="math.html" class="back-btn">&lt; Back to Home</a>

    <!-- Credits Content -->
    <div class="credits-container">
        <div class="title">RoboRealm</div>

        <div class="topic item-1">Creator</div>
        <div class="names item-1">LMH</div>

        <div class="topic item-2">Inspired By</div>
        <div class="names item-2">Noah's Tutoring Hub</div>

        <div class="topic item-3">Lines made By</div>
        <div class="names item-3">Sterling James, Xavier Herrera</div>
    </div>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
    <title>User Page</title>
</head>
<body style= font-family: sans-serif;">


    <!-- Notification Toast Element -->
    <div id="techNotify" style="position:fixed;top:20px;right:-350px;width:300px;background:#1a1a1a;color:#fff;padding:15px;border-left:4px solid #ff7f00;box-shadow:0 4px 15px rgba(0,0,0,0.5);font-family:sans-serif;transition:right 0.5s ease-in-out;z-index:9999;border-radius:4px;box-sizing:border-box;">                
        <div style="font-weight:bold;color:#ff7f00;margin-bottom:5px;">Message from Admin</div>
        <div id="notifyMessage" style="font-size:14px;">Process completed successfully.</div>                
        <div id="notifyBar" style="position:absolute;bottom:0;left:0;height:4px;background:#ff7f00;width:100%;"></div>                
    </div>

    <script>
        function showNotification(message) {
            const toast = document.getElementById('techNotify');
            const bar = document.getElementById('notifyBar');
            const messageBody = document.getElementById('notifyMessage');

            if (message) messageBody.innerText = message;

            // Slide in
            toast.style.right = '20px';
            
            // Reset and Animate Bar
            bar.style.transition = 'none';
            bar.style.width = '100%';
            setTimeout(() => {
                bar.style.transition = 'width 3s linear';
                bar.style.width = '0%';
            }, 100);

            // Slide out
            setTimeout(() => {
                toast.style.right = '-350px';
            }, 3000);
        }

        // Listen for storage changes from admin.html
        window.addEventListener('storage', (event) => {
            if (event.key === 'adminBroadcast') {
                showNotification(event.newValue);
            }
        });
    </script>
</body>
</html>
