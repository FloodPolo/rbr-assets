    <style>
        :root {
            --orange: #ff6600;
            --dark-orange: #e65c00;
            --bg-color: #0a0a0a;
            --panel-color: #1a1a1a;
            --text-color: #ffffff;
            --font-tech: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-tech);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(26,26,26,0.8);
            border: 1px solid var(--orange);
            padding: 8px 15px;
            border-radius: 50px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .nav-btn img {
            height: 25px;
            width: auto;
            filter: drop-shadow(0 0 2px var(--orange));
        }

        /* Search Bar Styling */
        .search-container {
            margin-top: 120px;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            letter-spacing: 4px;
            color: var(--orange);
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        #searchBar {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid var(--orange);
            color: white;
            font-family: var(--font-tech);
            border-radius: 5px;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
        }

        /* Rectangular Image Buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        .main-btn {
            height: 140px;
            border: 2px solid var(--orange);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 4px;
        }

        .main-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px var(--orange);
        }

        .btn-label {
            background: rgba(0, 0, 0, 0.8);
            color: var(--orange);
            width: 100%;
            padding: 8px 0;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 1px solid var(--orange);
        }

        /* Page Loader & Close Button */
        #content-viewer {
            display: none;
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background: var(--panel-color);
            border: 2px solid var(--orange);
            z-index: 2000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        #close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--orange);
            color: black;
            border: 2px solid white;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
        }

        /* Launch Button Style */
        #launch-btn {
            position: absolute;
            top: -15px;
            right: 30px;
            background: var(--orange);
            color: black;
            border: 2px solid white;
            height: 35px;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
            text-transform: uppercase;
            font-size: 11px;
            font-family: var(--font-tech);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<iframe id="page-frame" src=""></iframe>


    <script>
        function loadPage(url) {
            document.getElementById('page-frame').src = url;
            document.getElementById('content-viewer').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function unloadPage() {
            document.getElementById('content-viewer').style.display = 'none';
            document.getElementById('page-frame').src = '';
            document.body.style.overflow = 'auto';
        }

        function launchAB() {
            var url = document.getElementById('page-frame').src;
            if (!url || url === "" || url === window.location.href) return;

            var win = window.open('about:blank', '_blank');
            if (win) {
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                var iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.margin = '0';
                iframe.src = url;
                win.document.body.appendChild(iframe);
            }
        }

        function filterButtons() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let buttons = document.getElementsByClassName('main-btn');
            for (let i = 0; i < buttons.length; i++) {
                let text = buttons[i].querySelector('.btn-label').innerText.toLowerCase();
                buttons[i].style.display = text.includes(input) ? "flex" : "none";
            }
        }
    </script>
